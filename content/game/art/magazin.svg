<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img">
  <title>Verkaufsraum im магази́н</title>

  <rect width="1200" height="800" fill="#f0f9ff"/>
  <g opacity="0.5">
    <rect x="0" y="600" width="100" height="100" fill="#e2e8f0"/>
    <rect x="200" y="600" width="100" height="100" fill="#e2e8f0"/>
    <rect x="400" y="600" width="100" height="100" fill="#e2e8f0"/>
    <rect x="600" y="600" width="100" height="100" fill="#e2e8f0"/>
    <rect x="800" y="600" width="100" height="100" fill="#e2e8f0"/>
    <rect x="1000" y="600" width="100" height="100" fill="#e2e8f0"/>
    <rect x="100" y="700" width="100" height="100" fill="#e2e8f0"/>
    <rect x="300" y="700" width="100" height="100" fill="#e2e8f0"/>
    <rect x="500" y="700" width="100" height="100" fill="#e2e8f0"/>
    <rect x="700" y="700" width="100" height="100" fill="#e2e8f0"/>
    <rect x="900" y="700" width="100" height="100" fill="#e2e8f0"/>
    <rect x="1100" y="700" width="100" height="100" fill="#e2e8f0"/>
  </g>
  <rect x="0" y="600" width="1200" height="6" fill="#78716c"/>

  <!-- Regale mit Waren, Rückwand -->
  <g>
    <rect x="60" y="90" width="1080" height="440" fill="#f5f5f4" stroke="#78716c" stroke-width="6"/>
    <line x1="60" y1="220" x2="1140" y2="220" stroke="#78716c" stroke-width="8"/>
    <line x1="60" y1="350" x2="1140" y2="350" stroke="#78716c" stroke-width="8"/>
    <line x1="60" y1="480" x2="1140" y2="480" stroke="#78716c" stroke-width="8"/>
    <!-- Waren im oberen Regal: Gläser -->
    <g>
      <circle cx="110" cy="180" r="24" fill="#fbbf24" stroke="#78716c" stroke-width="3"/>
      <circle cx="170" cy="180" r="24" fill="#f87171" stroke="#78716c" stroke-width="3"/>
      <circle cx="230" cy="180" r="24" fill="#34d399" stroke="#78716c" stroke-width="3"/>
      <circle cx="290" cy="180" r="24" fill="#fbbf24" stroke="#78716c" stroke-width="3"/>
      <circle cx="350" cy="180" r="24" fill="#38bdf8" stroke="#78716c" stroke-width="3"/>
    </g>
    <!-- mittleres Regal: Dosen -->
    <g>
      <rect x="450" y="250" width="46" height="60" fill="#94a3b8" stroke="#78716c" stroke-width="3"/>
      <rect x="504" y="250" width="46" height="60" fill="#94a3b8" stroke="#78716c" stroke-width="3"/>
      <rect x="558" y="250" width="46" height="60" fill="#94a3b8" stroke="#78716c" stroke-width="3"/>
      <rect x="612" y="250" width="46" height="60" fill="#94a3b8" stroke="#78716c" stroke-width="3"/>
      <rect x="666" y="250" width="46" height="60" fill="#94a3b8" stroke="#78716c" stroke-width="3"/>
    </g>
    <!-- unteres Regal: Brot und Obst -->
    <g>
      <ellipse cx="800" cy="415" rx="34" ry="18" fill="#d6b98c" stroke="#78716c" stroke-width="3"/>
      <ellipse cx="870" cy="415" rx="34" ry="18" fill="#d6b98c" stroke="#78716c" stroke-width="3"/>
      <circle cx="960" cy="410" r="20" fill="#f87171" stroke="#78716c" stroke-width="3"/>
      <circle cx="1000" cy="410" r="20" fill="#f87171" stroke="#78716c" stroke-width="3"/>
      <circle cx="1040" cy="410" r="20" fill="#fbbf24" stroke="#78716c" stroke-width="3"/>
    </g>
  </g>

  <!-- Ladentheke mit Kasse -->
  <rect x="440" y="560" width="320" height="120" fill="#92400e" stroke="#78716c" stroke-width="8"/>
  <rect x="440" y="540" width="320" height="24" fill="#78350f"/>
  <rect x="560" y="495" width="90" height="50" rx="6" fill="#57534e" stroke="#78716c" stroke-width="4"/>
  <rect x="580" y="480" width="50" height="18" fill="#e2e8f0"/>

  <!-- Preisschild -->
  <rect x="900" y="490" width="120" height="50" rx="6" fill="#047857"/>
  <text x="960" y="522" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24"
        fill="#ffffff">цена́</text>
</svg>
