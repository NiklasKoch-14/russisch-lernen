<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img">
  <title>Verkaufsraum im магази́н — Platz an der Theke für die Verkäuferin</title>

  <!-- Wand und Boden. Bodenkante bei 0.65 wie in Bar und Café, damit eine
       Figur später auf 0.90 stehen kann, ohne zu schweben. -->
  <rect width="1200" height="800" fill="#f0f9ff"/>
  <rect x="0" y="520" width="1200" height="280" fill="#e7eef6"/>
  <rect x="0" y="520" width="1200" height="6" fill="#94a3b8"/>
  <g opacity="0.45">
    <rect x="0" y="560" width="120" height="80" fill="#cbd5e1"/>
    <rect x="240" y="560" width="120" height="80" fill="#cbd5e1"/>
    <rect x="480" y="560" width="120" height="80" fill="#cbd5e1"/>
    <rect x="720" y="560" width="120" height="80" fill="#cbd5e1"/>
    <rect x="960" y="560" width="120" height="80" fill="#cbd5e1"/>
    <rect x="120" y="660" width="120" height="90" fill="#cbd5e1"/>
    <rect x="360" y="660" width="120" height="90" fill="#cbd5e1"/>
    <rect x="600" y="660" width="120" height="90" fill="#cbd5e1"/>
    <rect x="840" y="660" width="120" height="90" fill="#cbd5e1"/>
    <rect x="1080" y="660" width="120" height="90" fill="#cbd5e1"/>
  </g>

  <!-- Regalwand: hoeher hinauf, damit der Raum nicht oben kahl ist -->
  <rect x="40" y="40" width="1120" height="400" fill="#f5f5f4" stroke="#78716c" stroke-width="6"/>
  <line x1="40" y1="150" x2="1160" y2="150" stroke="#78716c" stroke-width="8"/>
  <line x1="40" y1="255" x2="1160" y2="255" stroke="#78716c" stroke-width="8"/>
  <line x1="40" y1="350" x2="1160" y2="350" stroke="#78716c" stroke-width="8"/>

  <!-- oberes Regal: Glaeser -->
  <g>
    <circle cx="100" cy="115" r="26" fill="#fbbf24" stroke="#78716c" stroke-width="3"/>
    <circle cx="164" cy="115" r="26" fill="#f87171" stroke="#78716c" stroke-width="3"/>
    <circle cx="228" cy="115" r="26" fill="#34d399" stroke="#78716c" stroke-width="3"/>
    <circle cx="292" cy="115" r="26" fill="#fbbf24" stroke="#78716c" stroke-width="3"/>
    <circle cx="960" cy="115" r="26" fill="#38bdf8" stroke="#78716c" stroke-width="3"/>
    <circle cx="1024" cy="115" r="26" fill="#f87171" stroke="#78716c" stroke-width="3"/>
    <circle cx="1088" cy="115" r="26" fill="#34d399" stroke="#78716c" stroke-width="3"/>
  </g>

  <!-- mittleres Regal: Dosen und Flaschen -->
  <g>
    <rect x="90" y="182" width="46" height="64" fill="#94a3b8" stroke="#78716c" stroke-width="3"/>
    <rect x="146" y="182" width="46" height="64" fill="#94a3b8" stroke="#78716c" stroke-width="3"/>
    <rect x="202" y="182" width="46" height="64" fill="#94a3b8" stroke="#78716c" stroke-width="3"/>
    <path d="M900 246 l0 -44 q0 -18 16 -22 l0 -14 l20 0 l0 14 q16 4 16 22 l0 44 Z" fill="#38bdf8" stroke="#78716c" stroke-width="3"/>
    <path d="M980 246 l0 -44 q0 -18 16 -22 l0 -14 l20 0 l0 14 q16 4 16 22 l0 44 Z" fill="#fbbf24" stroke="#78716c" stroke-width="3"/>
    <path d="M1060 246 l0 -44 q0 -18 16 -22 l0 -14 l20 0 l0 14 q16 4 16 22 l0 44 Z" fill="#f87171" stroke="#78716c" stroke-width="3"/>
  </g>

  <!-- unteres Regal: Brot und Obst -->
  <g>
    <ellipse cx="120" cy="318" rx="38" ry="20" fill="#d6b98c" stroke="#78716c" stroke-width="3"/>
    <ellipse cx="200" cy="318" rx="38" ry="20" fill="#d6b98c" stroke="#78716c" stroke-width="3"/>
    <circle cx="940" cy="312" r="22" fill="#f87171" stroke="#78716c" stroke-width="3"/>
    <circle cx="990" cy="312" r="22" fill="#f87171" stroke="#78716c" stroke-width="3"/>
    <circle cx="1040" cy="312" r="22" fill="#fbbf24" stroke="#78716c" stroke-width="3"/>
    <circle cx="1090" cy="312" r="22" fill="#fbbf24" stroke="#78716c" stroke-width="3"/>
  </g>

  <!-- Kisten am Boden, damit der Raum unten nicht leer ist -->
  <g>
    <rect x="70" y="470" width="150" height="90" rx="6" fill="#d6b98c" stroke="#92400e" stroke-width="5"/>
    <line x1="70" y1="500" x2="220" y2="500" stroke="#92400e" stroke-width="4"/>
    <circle cx="110" cy="462" r="18" fill="#f87171" stroke="#92400e" stroke-width="3"/>
    <circle cx="150" cy="458" r="18" fill="#fbbf24" stroke="#92400e" stroke-width="3"/>
    <circle cx="190" cy="462" r="18" fill="#f87171" stroke="#92400e" stroke-width="3"/>
    <rect x="1000" y="500" width="140" height="86" rx="6" fill="#d6b98c" stroke="#92400e" stroke-width="5"/>
    <line x1="1000" y1="530" x2="1140" y2="530" stroke="#92400e" stroke-width="4"/>
  </g>

  <!-- Ladentheke: Oberkante bei 0.54 wie in der Bar, damit eine Halbfigur
       dahinter passt, ohne davor zu stehen -->
  <rect x="380" y="432" width="440" height="270" fill="#92400e" stroke="#78350f" stroke-width="8"/>
  <rect x="380" y="412" width="440" height="26" fill="#78350f"/>
  <rect x="700" y="360" width="96" height="54" rx="6" fill="#57534e" stroke="#44403c" stroke-width="4"/>
  <rect x="722" y="342" width="52" height="20" fill="#e2e8f0"/>
  <g>
    <rect x="424" y="352" width="80" height="60" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
    <line x1="424" y1="382" x2="504" y2="382" stroke="#94a3b8" stroke-width="3"/>
  </g>
</svg>
