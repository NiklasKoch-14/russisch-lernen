  <ellipse cx="112" cy="70" rx="7" ry="6" fill="#ffffff" stroke="#44403c" stroke-width="2"/>
  <circle cx="89" cy="71" r="3" fill="#1c1917"/>
  <circle cx="113" cy="71" r="3" fill="#1c1917"/>
  <path d="M98 72 q-4 12 2 15 q6 -3 1 -15" fill="#d8ab86"/>
