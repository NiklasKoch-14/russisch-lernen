  <rect x="104" y="248" width="22" height="128" rx="8" fill="#1e3a8a"/>
  <path d="M70 376 q-8 12 6 14 l28 0 l0 -14 Z" fill="#292524"/>
  <path d="M132 376 q8 12 -6 14 l-28 0 l0 -14 Z" fill="#292524"/>

  <!-- Kapuzenpulli -->
  <path d="M60 130 q40 -18 80 0 l8 128 l-96 0 Z" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="4"/>
  <path d="M74 130 q26 26 52 0 q-26 -14 -52 0 Z" fill="#2563eb"/>
  <path d="M88 140 q4 34 -6 48" fill="none" stroke="#dbeafe" stroke-width="5" stroke-linecap="round"/>
  <path d="M112 140 q-4 34 6 48" fill="none" stroke="#dbeafe" stroke-width="5" stroke-linecap="round"/>

  <!-- Arme, eine Hand erklaert etwas -->
