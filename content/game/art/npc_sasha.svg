  <ellipse cx="100" cy="66" rx="31" ry="35" fill="#e8c19c" stroke="#7c2d12" stroke-width="2"/>
  <ellipse cx="71" cy="68" rx="5" ry="8" fill="#e8c19c" stroke="#7c2d12" stroke-width="2"/>
  <ellipse cx="129" cy="68" rx="5" ry="8" fill="#e8c19c" stroke="#7c2d12" stroke-width="2"/>

  <!-- Wuschelhaar -->
