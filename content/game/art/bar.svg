<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img">
  <title>Gaststube in der бар</title>

  <rect width="1200" height="800" fill="#44403c"/>
  <rect x="0" y="600" width="1200" height="200" fill="#57534e"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#292524" stroke-width="6"/>

  <!-- Abendfenster -->
  <rect x="70" y="80" width="200" height="180" rx="6" fill="#1e3a8a" stroke="#292524" stroke-width="8"/>
  <circle cx="230" cy="120" r="16" fill="#fde68a"/>
  <line x1="170" y1="80" x2="170" y2="260" stroke="#292524" stroke-width="6"/>

  <!-- Regal mit Flaschen hinter der Theke -->
  <rect x="760" y="60" width="380" height="260" fill="#292524" stroke="#1c1917" stroke-width="6"/>
  <line x1="760" y1="140" x2="1140" y2="140" stroke="#1c1917" stroke-width="6"/>
  <line x1="760" y1="220" x2="1140" y2="220" stroke="#1c1917" stroke-width="6"/>
  <g>
    <rect x="785" y="90" width="18" height="50" fill="#38bdf8"/>
    <rect x="815" y="95" width="18" height="45" fill="#f87171"/>
    <rect x="845" y="88" width="18" height="52" fill="#fbbf24"/>
    <rect x="875" y="92" width="18" height="48" fill="#34d399"/>
    <rect x="905" y="90" width="18" height="50" fill="#38bdf8"/>
    <rect x="785" y="170" width="18" height="50" fill="#f87171"/>
    <rect x="815" y="172" width="18" height="48" fill="#fbbf24"/>
    <rect x="845" y="168" width="18" height="52" fill="#38bdf8"/>
    <rect x="875" y="174" width="18" height="46" fill="#34d399"/>
  </g>

  <!-- Theke -->
  <rect x="700" y="420" width="460" height="200" fill="#78350f" stroke="#292524" stroke-width="8"/>
  <rect x="700" y="400" width="460" height="26" fill="#92400e"/>
  <g>
    <rect x="900" y="500" width="8" height="70" fill="#292524"/>
    <ellipse cx="904" cy="500" rx="20" ry="8" fill="#e2e8f0"/>
  </g>
  <g>
    <rect x="1030" y="510" width="8" height="60" fill="#292524"/>
    <ellipse cx="1034" cy="510" rx="16" ry="6" fill="#fde68a"/>
  </g>

  <!-- Hocker vor der Theke -->
  <g>
    <ellipse cx="800" cy="470" rx="26" ry="10" fill="#a8a29e" stroke="#292524" stroke-width="4"/>
    <line x1="780" y1="478" x2="780" y2="600" stroke="#292524" stroke-width="6"/>
    <line x1="820" y1="478" x2="820" y2="600" stroke="#292524" stroke-width="6"/>
  </g>

  <!-- Pjotrs Tisch mit einem Stuhl -->
  <g>
    <circle cx="330" cy="500" r="70" fill="#57534e" stroke="#292524" stroke-width="6"/>
    <circle cx="300" cy="470" r="14" fill="#fde68a" opacity="0.9"/>
    <path d="M260 610 q10 -70 0 -140" fill="none" stroke="#292524" stroke-width="10"/>
    <rect x="230" y="600" width="70" height="16" fill="#292524"/>
    <line x1="240" y1="616" x2="240" y2="670" stroke="#292524" stroke-width="8"/>
    <line x1="280" y1="616" x2="280" y2="670" stroke="#292524" stroke-width="8"/>
  </g>

  <!-- Kerze auf Pjotrs Tisch -->
  <rect x="322" y="480" width="10" height="24" fill="#f5f5f4"/>
  <circle cx="327" cy="474" r="6" fill="#fde68a"/>
</svg>
