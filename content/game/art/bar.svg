<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img">
  <title>Gaststube in der бар — die Leute liegen als eigene Ebene darüber</title>

  <!-- Wand und Boden. Die Bodenkante bei 0.75 ist die Bezugslinie fuer die
       Plaetze in npcs.json: wer steht, hat die Fuesse knapp darunter. -->
  <rect width="1200" height="800" fill="#44403c"/>
  <rect x="0" y="600" width="1200" height="200" fill="#57534e"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#292524" stroke-width="6"/>
  <path d="M0 600 L1200 600 L1200 640 L0 640 Z" fill="#4a4441" opacity="0.6"/>

  <!-- Abendfenster links -->
  <rect x="60" y="70" width="200" height="180" rx="6" fill="#1e3a8a" stroke="#292524" stroke-width="8"/>
  <circle cx="220" cy="112" r="16" fill="#fde68a"/>
  <line x1="160" y1="70" x2="160" y2="250" stroke="#292524" stroke-width="6"/>
  <line x1="60" y1="160" x2="260" y2="160" stroke="#292524" stroke-width="6"/>

  <!-- Haengelampen -->
  <g stroke="#292524" stroke-width="4">
    <line x1="600" y1="0" x2="600" y2="90"/>
    <line x1="980" y1="0" x2="980" y2="70"/>
  </g>
  <path d="M560 90 L640 90 L620 130 L580 130 Z" fill="#78350f"/>
  <circle cx="600" cy="134" r="9" fill="#fde68a"/>
  <path d="M944 70 L1016 70 L998 106 L962 106 Z" fill="#78350f"/>
  <circle cx="980" cy="110" r="8" fill="#fde68a"/>

  <!-- Bild an der Wand, damit die Mitte nicht kahl ist -->
  <rect x="470" y="180" width="150" height="110" fill="#3f3f46" stroke="#78350f" stroke-width="8"/>
  <path d="M486 270 L536 210 L570 250 L604 220 L604 270 Z" fill="#65a30d" opacity="0.8"/>

  <!-- Regal mit Flaschen, hinter der Theke -->
  <rect x="900" y="60" width="280" height="250" fill="#292524" stroke="#1c1917" stroke-width="6"/>
  <line x1="900" y1="140" x2="1180" y2="140" stroke="#1c1917" stroke-width="6"/>
  <line x1="900" y1="225" x2="1180" y2="225" stroke="#1c1917" stroke-width="6"/>
  <g>
    <rect x="925" y="88" width="18" height="52" fill="#38bdf8"/>
    <rect x="955" y="92" width="18" height="48" fill="#f87171"/>
    <rect x="985" y="86" width="18" height="54" fill="#fbbf24"/>
    <rect x="1105" y="90" width="18" height="50" fill="#34d399"/>
    <rect x="925" y="175" width="18" height="50" fill="#f87171"/>
    <rect x="1135" y="172" width="18" height="53" fill="#38bdf8"/>
  </g>

  <!-- Theke rechts. Ihre Oberkante bei 0.54 begrenzt Nadjas Platz: sie steht
       dahinter, deshalb reicht ihre Zeichnung nur bis zur Huefte. -->
  <rect x="900" y="432" width="300" height="190" fill="#78350f" stroke="#292524" stroke-width="8"/>
  <rect x="900" y="412" width="300" height="26" fill="#92400e"/>
  <g>
    <rect x="1130" y="500" width="8" height="70" fill="#292524"/>
    <ellipse cx="1134" cy="500" rx="20" ry="8" fill="#e2e8f0"/>
  </g>

  <!-- Runder Tisch links, zwischen den beiden Plaetzen davor -->
  <ellipse cx="250" cy="516" rx="66" ry="26" fill="#57534e" stroke="#292524" stroke-width="6"/>
  <rect x="243" y="516" width="14" height="90" fill="#292524"/>
  <ellipse cx="250" cy="606" rx="40" ry="14" fill="#292524"/>
  <rect x="238" y="486" width="12" height="28" fill="#f5f5f4"/>
  <circle cx="244" cy="480" r="7" fill="#fde68a"/>

  <!-- Zweiter Tisch weiter hinten, nur als Tiefe -->
  <ellipse cx="700" cy="470" rx="46" ry="18" fill="#4a4441" stroke="#292524" stroke-width="5"/>
  <rect x="695" y="470" width="10" height="64" fill="#292524"/>
  <ellipse cx="700" cy="534" rx="28" ry="10" fill="#292524"/>
</svg>
