<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img">
  <title>Gaststube in der бар — die Leute liegen als eigene Ebene darüber</title>

  <!-- Wand und Boden. Die Bodenkante bei 0.65 lässt Platz für die Figuren:
       ihre Füße stehen bei 0.90, also gut sichtbar im Bodenbereich. -->
  <rect width="1200" height="800" fill="#44403c"/>
  <rect x="0" y="520" width="1200" height="280" fill="#57534e"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#292524" stroke-width="6"/>
  <path d="M0 520 L1200 520 L1200 560 L0 560 Z" fill="#4a4441" opacity="0.6"/>
  <g stroke="#4a4441" stroke-width="3" opacity="0.7">
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="0" y1="730" x2="1200" y2="730"/>
  </g>

  <!-- Abendfenster links -->
  <rect x="60" y="60" width="200" height="170" rx="6" fill="#1e3a8a" stroke="#292524" stroke-width="8"/>
  <circle cx="220" cy="100" r="16" fill="#fde68a"/>
  <line x1="160" y1="60" x2="160" y2="230" stroke="#292524" stroke-width="6"/>
  <line x1="60" y1="145" x2="260" y2="145" stroke="#292524" stroke-width="6"/>

  <!-- Haengelampen -->
  <g stroke="#292524" stroke-width="4">
    <line x1="560" y1="0" x2="560" y2="70"/>
    <line x1="980" y1="0" x2="980" y2="50"/>
  </g>
  <path d="M522 70 L598 70 L578 108 L542 108 Z" fill="#78350f"/>
  <circle cx="560" cy="112" r="9" fill="#fde68a"/>
  <path d="M946 50 L1014 50 L996 84 L964 84 Z" fill="#78350f"/>
  <circle cx="980" cy="88" r="8" fill="#fde68a"/>

  <!-- Bild an der Wand -->
  <rect x="330" y="120" width="150" height="110" fill="#3f3f46" stroke="#78350f" stroke-width="8"/>
  <path d="M346 210 L396 150 L430 190 L464 160 L464 210 Z" fill="#65a30d" opacity="0.8"/>

  <!-- Regal mit Flaschen hinter der Theke -->
  <rect x="900" y="40" width="280" height="240" fill="#292524" stroke="#1c1917" stroke-width="6"/>
  <line x1="900" y1="118" x2="1180" y2="118" stroke="#1c1917" stroke-width="6"/>
  <line x1="900" y1="200" x2="1180" y2="200" stroke="#1c1917" stroke-width="6"/>
  <g>
    <rect x="925" y="66" width="18" height="52" fill="#38bdf8"/>
    <rect x="955" y="70" width="18" height="48" fill="#f87171"/>
    <rect x="985" y="64" width="18" height="54" fill="#fbbf24"/>
    <rect x="1105" y="68" width="18" height="50" fill="#34d399"/>
    <rect x="925" y="150" width="18" height="50" fill="#f87171"/>
    <rect x="1135" y="147" width="18" height="53" fill="#38bdf8"/>
  </g>

  <!-- Theke rechts. Ihre Oberkante bei 0.54 begrenzt Nadjas Platz: sie steht
       dahinter, deshalb reicht ihre Zeichnung nur bis zur Huefte. -->
  <rect x="912" y="432" width="288" height="270" fill="#78350f" stroke="#292524" stroke-width="8"/>
  <rect x="912" y="412" width="288" height="26" fill="#92400e"/>
  <g>
    <rect x="1140" y="500" width="8" height="70" fill="#292524"/>
    <ellipse cx="1144" cy="500" rx="20" ry="8" fill="#e2e8f0"/>
  </g>

  <!-- Runder Tisch zwischen Pjotr und Vera, auf Sitzhoehe -->
  <ellipse cx="248" cy="596" rx="74" ry="28" fill="#57534e" stroke="#292524" stroke-width="6"/>
  <rect x="240" y="596" width="16" height="102" fill="#292524"/>
  <ellipse cx="248" cy="698" rx="46" ry="16" fill="#292524"/>
  <rect x="236" y="562" width="12" height="30" fill="#f5f5f4"/>
  <circle cx="242" cy="556" r="7" fill="#fde68a"/>

  <!-- Zweiter Tisch weiter hinten, gibt dem Raum Tiefe -->
  <ellipse cx="700" cy="500" rx="52" ry="20" fill="#4a4441" stroke="#292524" stroke-width="5"/>
  <rect x="694" y="500" width="12" height="76" fill="#292524"/>
  <ellipse cx="700" cy="576" rx="32" ry="12" fill="#292524"/>
</svg>
