<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img">
  <title>Gaststube im кафе́ — die Leute liegen als eigene Ebene darüber</title>

  <rect width="1200" height="800" fill="#fffbeb"/>
  <rect x="0" y="520" width="1200" height="280" fill="#e7d7c1"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#d6b98c" stroke-width="6"/>
  <g stroke="#d6b98c" stroke-width="3" opacity="0.8">
    <line x1="0" y1="620" x2="1200" y2="620"/>
    <line x1="0" y1="720" x2="1200" y2="720"/>
  </g>

  <!-- Grosses Fenster links -->
  <rect x="70" y="80" width="250" height="200" rx="8" fill="#dbeafe" stroke="#a8a29e" stroke-width="8"/>
  <line x1="195" y1="80" x2="195" y2="280" stroke="#a8a29e" stroke-width="6"/>
  <line x1="70" y1="180" x2="320" y2="180" stroke="#a8a29e" stroke-width="6"/>
  <path d="M70 80 L320 80 L320 108 L70 108 Z" fill="#f59e0b" opacity="0.7"/>

  <!-- Tafel an der Wand, ohne Schrift -->
  <rect x="420" y="110" width="180" height="130" rx="6" fill="#3f3f46" stroke="#92400e" stroke-width="8"/>
  <g stroke="#e7e5e4" stroke-width="4" opacity="0.6">
    <line x1="445" y1="150" x2="550" y2="150"/>
    <line x1="445" y1="176" x2="575" y2="176"/>
    <line x1="445" y1="202" x2="520" y2="202"/>
  </g>

  <!-- Haengelampe -->
  <line x1="800" y1="0" x2="800" y2="80" stroke="#a8a29e" stroke-width="4"/>
  <path d="M758 80 L842 80 L822 124 L778 124 Z" fill="#c2410c"/>
  <circle cx="800" cy="128" r="9" fill="#fde68a"/>

  <!-- Tresen rechts mit Maschine und Kuchenglocke -->
  <rect x="880" y="430" width="300" height="270" fill="#92400e" stroke="#78350f" stroke-width="8"/>
  <rect x="880" y="410" width="300" height="24" fill="#b45309"/>
  <rect x="1080" y="330" width="90" height="80" rx="6" fill="#57534e" stroke="#292524" stroke-width="5"/>
  <rect x="1098" y="300" width="20" height="30" fill="#57534e"/>
  <rect x="1136" y="300" width="20" height="30" fill="#57534e"/>
  <circle cx="1104" cy="366" r="7" fill="#fbbf24"/>
  <circle cx="1146" cy="366" r="7" fill="#fbbf24"/>
  <path d="M920 410 q40 -56 80 0 Z" fill="#f8fafc" opacity="0.85" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="960" cy="392" r="8" fill="#fca5a5"/>

  <!-- Zwei Tische links, einer gedeckt -->
  <ellipse cx="220" cy="580" rx="96" ry="36" fill="#f5f5f4" stroke="#d6b98c" stroke-width="6"/>
  <rect x="212" y="580" width="16" height="104" fill="#a8a29e"/>
  <ellipse cx="220" cy="684" rx="54" ry="18" fill="#a8a29e"/>
  <rect x="182" y="548" width="28" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <path d="M210 554 q14 6 0 14" fill="none" stroke="#ffffff" stroke-width="5"/>

  <ellipse cx="700" cy="498" rx="62" ry="24" fill="#f5f5f4" stroke="#d6b98c" stroke-width="5"/>
  <rect x="694" y="498" width="12" height="76" fill="#a8a29e"/>
  <ellipse cx="700" cy="574" rx="36" ry="13" fill="#a8a29e"/>

  <!-- Stuhllehnen als Andeutung -->
  <path d="M104 620 q0 -66 0 -72" stroke="#a8a29e" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M340 620 q0 -66 0 -72" stroke="#a8a29e" stroke-width="10" fill="none" stroke-linecap="round"/>
</svg>
