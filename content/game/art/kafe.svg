<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img">
  <title>Gaststube im кафе́ — die Leute liegen als eigene Ebene darüber</title>

  <rect width="1200" height="800" fill="#fffbeb"/>
  <rect x="0" y="600" width="1200" height="200" fill="#e7d7c1"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#d6b98c" stroke-width="6"/>
  <g stroke="#d6b98c" stroke-width="3" opacity="0.8">
    <line x1="0" y1="660" x2="1200" y2="660"/>
    <line x1="0" y1="730" x2="1200" y2="730"/>
  </g>

  <!-- Grosses Fenster links, Vormittagslicht -->
  <rect x="70" y="90" width="260" height="220" rx="8" fill="#dbeafe" stroke="#a8a29e" stroke-width="8"/>
  <line x1="200" y1="90" x2="200" y2="310" stroke="#a8a29e" stroke-width="6"/>
  <line x1="70" y1="200" x2="330" y2="200" stroke="#a8a29e" stroke-width="6"/>
  <path d="M70 90 L330 90 L330 120 L70 120 Z" fill="#f59e0b" opacity="0.7"/>

  <!-- Tafel an der Wand, ohne Schrift -->
  <rect x="430" y="130" width="180" height="130" rx="6" fill="#3f3f46" stroke="#92400e" stroke-width="8"/>
  <g stroke="#e7e5e4" stroke-width="4" opacity="0.6">
    <line x1="455" y1="170" x2="560" y2="170"/>
    <line x1="455" y1="196" x2="585" y2="196"/>
    <line x1="455" y1="222" x2="530" y2="222"/>
  </g>

  <!-- Haengelampe -->
  <line x1="760" y1="0" x2="760" y2="96" stroke="#a8a29e" stroke-width="4"/>
  <path d="M718 96 L802 96 L782 140 L738 140 Z" fill="#c2410c"/>
  <circle cx="760" cy="144" r="9" fill="#fde68a"/>

  <!-- Tresen rechts mit Maschine und Kuchenglocke -->
  <rect x="880" y="430" width="300" height="180" fill="#92400e" stroke="#78350f" stroke-width="8"/>
  <rect x="880" y="410" width="300" height="24" fill="#b45309"/>
  <rect x="1080" y="330" width="90" height="80" rx="6" fill="#57534e" stroke="#292524" stroke-width="5"/>
  <rect x="1098" y="300" width="20" height="30" fill="#57534e"/>
  <rect x="1136" y="300" width="20" height="30" fill="#57534e"/>
  <circle cx="1104" cy="366" r="7" fill="#fbbf24"/>
  <circle cx="1146" cy="366" r="7" fill="#fbbf24"/>
  <path d="M920 410 q40 -56 80 0 Z" fill="#f8fafc" opacity="0.85" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="960" cy="392" r="8" fill="#fca5a5"/>

  <!-- Zwei Tische links, einer davon gedeckt -->
  <ellipse cx="230" cy="520" rx="86" ry="32" fill="#f5f5f4" stroke="#d6b98c" stroke-width="6"/>
  <rect x="222" y="520" width="16" height="90" fill="#a8a29e"/>
  <ellipse cx="230" cy="610" rx="48" ry="16" fill="#a8a29e"/>
  <rect x="196" y="492" width="26" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <path d="M222 498 q14 6 0 12" fill="none" stroke="#ffffff" stroke-width="5"/>

  <ellipse cx="700" cy="466" rx="58" ry="22" fill="#f5f5f4" stroke="#d6b98c" stroke-width="5"/>
  <rect x="694" y="466" width="12" height="70" fill="#a8a29e"/>
  <ellipse cx="700" cy="536" rx="34" ry="12" fill="#a8a29e"/>

  <!-- Stuhllehnen als Andeutung -->
  <path d="M120 560 q0 -60 0 -66" stroke="#a8a29e" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M344 560 q0 -60 0 -66" stroke="#a8a29e" stroke-width="10" fill="none" stroke-linecap="round"/>
</svg>
