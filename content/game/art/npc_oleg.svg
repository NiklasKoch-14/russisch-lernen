<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" role="img">
  <title>Оле́г, breit auf dem Hocker am Tresen</title>

  <!-- Hocker -->
  <rect x="30" y="252" width="84" height="16" rx="5" fill="#57534e" stroke="#292524" stroke-width="3"/>
  <line x1="44" y1="268" x2="38" y2="372" stroke="#44403c" stroke-width="10" stroke-linecap="round"/>
  <line x1="100" y1="268" x2="106" y2="372" stroke="#44403c" stroke-width="10" stroke-linecap="round"/>
  <line x1="42" y1="324" x2="102" y2="324" stroke="#44403c" stroke-width="7"/>

  <!-- Beine, breit sitzend -->
  <path d="M50 230 L154 246 L154 296 L50 280 Z" fill="#3f3f46"/>
  <rect x="126" y="280" width="34" height="90" rx="11" fill="#3f3f46"/>
  <path d="M124 370 q-6 14 12 16 l38 0 q6 -10 -6 -16 Z" fill="#1c1917"/>

  <!-- breiter Rumpf in der Arbeitsjacke -->
  <path d="M38 126 q50 -20 92 0 l6 112 l-104 6 Z" fill="#3f6212" stroke="#1a2e05" stroke-width="4"/>
  <path d="M76 122 l0 120 l20 -1 l0 -119 Z" fill="#57534e"/>
  <path d="M38 126 q-8 60 -4 106" fill="none" stroke="#1a2e05" stroke-width="4"/>

  <!-- Arme: ein Glas vorn auf dem Tresen, ein Arm haengt -->
  <path d="M126 148 q36 26 34 62" fill="none" stroke="#3f6212" stroke-width="23" stroke-linecap="round"/>
  <path d="M44 150 q-16 44 8 66" fill="none" stroke="#3f6212" stroke-width="23" stroke-linecap="round"/>
  <circle cx="160" cy="216" r="13" fill="#d9a97e"/>
  <circle cx="60" cy="222" r="13" fill="#d9a97e"/>
  <rect x="150" y="186" width="22" height="30" rx="3" fill="#fde68a" opacity="0.85" stroke="#a16207" stroke-width="2"/>

  <!-- Hals und kantiger Kopf -->
  <rect x="74" y="92" width="30" height="30" rx="8" fill="#d9a97e"/>
  <path d="M56 58 q0 -34 32 -34 q32 0 32 34 q0 40 -32 48 q-32 -8 -32 -48 Z" fill="#d9a97e" stroke="#57534e" stroke-width="2"/>
  <ellipse cx="54" cy="62" rx="5" ry="8" fill="#d9a97e" stroke="#57534e" stroke-width="2"/>
  <ellipse cx="122" cy="62" rx="5" ry="8" fill="#d9a97e" stroke="#57534e" stroke-width="2"/>

  <!-- Wollmuetze -->
  <path d="M54 40 q0 -28 34 -28 q34 0 34 28 q-34 -10 -68 0 Z" fill="#7f1d1d"/>
  <rect x="52" y="36" width="72" height="14" rx="5" fill="#991b1b"/>

  <!-- Brauen, schmale Augen, Bart, Strichmund -->
  <path d="M64 60 q11 -5 20 1" fill="none" stroke="#292524" stroke-width="5" stroke-linecap="round"/>
  <path d="M92 61 q9 -6 20 -1" fill="none" stroke="#292524" stroke-width="5" stroke-linecap="round"/>
  <path d="M68 72 q8 -5 16 0" fill="none" stroke="#292524" stroke-width="3" stroke-linecap="round"/>
  <path d="M92 72 q8 -5 16 0" fill="none" stroke="#292524" stroke-width="3" stroke-linecap="round"/>
  <circle cx="76" cy="73" r="2.5" fill="#1c1917"/>
  <circle cx="100" cy="73" r="2.5" fill="#1c1917"/>
  <path d="M82 74 q-6 14 6 17 q12 -3 6 -17" fill="#c9926a"/>
  <path d="M60 78 q2 34 28 38 q26 -4 28 -38 q-6 22 -28 24 q-22 -2 -28 -24 Z" fill="#44403c"/>
  <path d="M76 94 l24 0" stroke="#292524" stroke-width="4" stroke-linecap="round"/>
</svg>
