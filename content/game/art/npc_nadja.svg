<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" role="img">
  <title>На́дя, hinter der Theke — Halbfigur bis zur Thekenkante</title>

  <!-- Rumpf in der tuerkisen Bluse mit heller Schuerze -->
  <path d="M56 154 q44 -22 88 0 l10 146 l-108 0 Z" fill="#0f766e" stroke="#134e4a" stroke-width="4"/>
  <path d="M78 190 l44 0 l6 110 l-56 0 Z" fill="#f1f5f9"/>
  <path d="M78 190 q22 -12 44 0" fill="none" stroke="#cbd5e1" stroke-width="4"/>

  <!-- Arme, eine Hand wischt die Theke -->
  <path d="M58 168 q-26 42 -16 84" fill="none" stroke="#0f766e" stroke-width="22" stroke-linecap="round"/>
  <path d="M142 168 q26 40 18 78" fill="none" stroke="#0f766e" stroke-width="22" stroke-linecap="round"/>
  <circle cx="44" cy="258" r="12" fill="#f0c9a8"/>
  <circle cx="162" cy="252" r="12" fill="#f0c9a8"/>

  <!-- Hals und Kopf -->
  <rect x="88" y="116" width="24" height="32" rx="8" fill="#f0c9a8"/>
  <ellipse cx="100" cy="84" rx="32" ry="36" fill="#f0c9a8" stroke="#9a3412" stroke-width="2"/>
  <ellipse cx="70" cy="86" rx="5" ry="8" fill="#f0c9a8" stroke="#9a3412" stroke-width="2"/>
  <ellipse cx="130" cy="86" rx="5" ry="8" fill="#f0c9a8" stroke="#9a3412" stroke-width="2"/>
  <circle cx="70" cy="96" r="4" fill="#fcd34d"/>
  <circle cx="130" cy="96" r="4" fill="#fcd34d"/>

  <!-- rotes Haar, straff nach hinten, Dutt -->
  <path d="M70 74 q2 -32 30 -34 q28 2 30 34 q-6 -20 -30 -22 q-24 2 -30 22 Z" fill="#b45309"/>
  <circle cx="100" cy="40" r="14" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <path d="M68 80 q-6 -14 2 -24" fill="none" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
  <path d="M132 80 q6 -14 -2 -24" fill="none" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>

  <!-- Augen, Nase, kurzer Mund -->
  <path d="M80 76 q9 -5 18 -1" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <path d="M104 75 q9 -4 17 1" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="88" cy="88" rx="6" ry="5" fill="#ffffff" stroke="#44403c" stroke-width="2"/>
  <ellipse cx="112" cy="88" rx="6" ry="5" fill="#ffffff" stroke="#44403c" stroke-width="2"/>
  <circle cx="89" cy="89" r="2.5" fill="#1c1917"/>
  <circle cx="113" cy="89" r="2.5" fill="#1c1917"/>
  <path d="M99 90 q-4 12 1 15 q6 -3 1 -15" fill="#e0ae8a"/>
  <path d="M90 112 q10 6 20 0" fill="none" stroke="#9f1239" stroke-width="4" stroke-linecap="round"/>
</svg>
