<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" role="img">
  <title>Пётр, sitzend am Tisch, den Knien nach rechts gewandt</title>

  <!-- Hocker unter dem Gesaess: gehoert zur Figur, damit sie ueberall sitzt -->
  <rect x="34" y="250" width="76" height="14" rx="5" fill="#57534e" stroke="#292524" stroke-width="3"/>
  <line x1="46" y1="264" x2="40" y2="372" stroke="#44403c" stroke-width="9" stroke-linecap="round"/>
  <line x1="98" y1="264" x2="104" y2="372" stroke="#44403c" stroke-width="9" stroke-linecap="round"/>
  <line x1="44" y1="320" x2="100" y2="320" stroke="#44403c" stroke-width="6"/>

  <!-- Beine: Oberschenkel waagerecht nach vorn, Unterschenkel hinunter -->
  <path d="M56 232 L150 244 L150 288 L56 276 Z" fill="#3f3f46"/>
  <rect x="126" y="272" width="30" height="96" rx="10" fill="#3f3f46"/>
  <path d="M124 368 q-6 14 10 16 l34 0 q6 -10 -4 -16 Z" fill="#292524"/>

  <!-- Rumpf in der Jacke, leicht nach vorn geneigt -->
  <path d="M48 132 q40 -18 78 0 l8 108 l-92 4 Z" fill="#57534e" stroke="#292524" stroke-width="4"/>
  <path d="M82 128 l0 116 l16 -1 l0 -115 Z" fill="#d6d3d1"/>

  <!-- Arme: die Haende ruhen vorn auf dem Tisch -->
  <path d="M120 150 q34 30 34 66" fill="none" stroke="#57534e" stroke-width="21" stroke-linecap="round"/>
  <path d="M56 152 q-16 40 14 62" fill="none" stroke="#57534e" stroke-width="21" stroke-linecap="round"/>
  <circle cx="154" cy="222" r="12" fill="#e7bfa0"/>
  <circle cx="76" cy="218" r="12" fill="#e7bfa0"/>

  <!-- Hals und Kopf -->
  <rect x="80" y="96" width="26" height="30" rx="8" fill="#e7bfa0"/>
  <ellipse cx="96" cy="64" rx="32" ry="36" fill="#e7bfa0" stroke="#78350f" stroke-width="2"/>
  <ellipse cx="66" cy="66" rx="5" ry="8" fill="#e7bfa0" stroke="#78350f" stroke-width="2"/>
  <ellipse cx="126" cy="66" rx="5" ry="8" fill="#e7bfa0" stroke="#78350f" stroke-width="2"/>

  <!-- graues Haar, Augen, Nase, Schnurrbart -->
  <path d="M68 48 q6 -20 28 -22 q22 2 28 22 q-24 -8 -56 0 Z" fill="#e2e8f0"/>
  <path d="M76 60 q8 -5 16 0" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 60 q8 -5 16 0" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="84" cy="68" r="3" fill="#292524"/>
  <circle cx="108" cy="68" r="3" fill="#292524"/>
  <path d="M95 68 q-4 12 1 15 q5 -3 1 -15" fill="#d9a97e"/>
  <path d="M80 86 q16 7 32 0 q-8 4 -16 3 q-8 1 -16 -3 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <path d="M88 94 q8 3 16 0" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>

  <!-- Schiebermuetze -->
  <path d="M62 46 q4 -22 34 -24 q30 2 34 24 q-34 -10 -68 0 Z" fill="#292524"/>
  <path d="M56 48 q20 -8 40 -9 q20 1 40 9 q-20 -3 -40 -2 q-20 -1 -40 2 Z" fill="#1c1917"/>
  <path d="M130 47 q10 -2 16 4 q-6 6 -16 6 Z" fill="#1c1917"/>
</svg>
