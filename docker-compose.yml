services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  # Kein ports-Eintrag: der Dienst ist nur im Docker-Netz erreichbar, das
  # Frontend spricht ausschliesslich das Backend an.
  tts:
    build:
      context: ./tts
      args:
        PIPER_VOICE: ${PIPER_VOICE:-ru_RU-denis-medium}
        PIPER_VOICE_FEMALE: ${PIPER_VOICE_FEMALE:-ru_RU-irina-medium}
    environment:
      - PIPER_VOICE=${PIPER_VOICE:-ru_RU-denis-medium}
      - PIPER_VOICE_FEMALE=${PIPER_VOICE_FEMALE:-ru_RU-irina-medium}
      - PIPER_LENGTH_SCALE=${PIPER_LENGTH_SCALE:-1.15}
      - PIPER_VOLUME=${PIPER_VOLUME:-1.0}

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - DB_PATH=/data/speaker.db
      - DEFAULT_LANGUAGE=russian
      - CONTENT_DIR=/app/content/ru
      - GAME_DIR=/app/content/game
      - TTS_HOST=http://tts:5001
      # Muessen mit den Stimmen des tts-Dienstes uebereinstimmen: die Werte gehen
      # in den Zwischenspeicher-Schluessel ein. Zwei Stimmen, weil in den
      # Hoergespraechen zwei Figuren miteinander reden.
      - PIPER_VOICE=${PIPER_VOICE:-ru_RU-denis-medium}
      - PIPER_VOICE_FEMALE=${PIPER_VOICE_FEMALE:-ru_RU-irina-medium}
      - PIPER_LENGTH_SCALE=${PIPER_LENGTH_SCALE:-1.15}
      - AUDIO_CACHE_DIR=/data/audio
      - AUDIO_CACHE_MAX_MB=${AUDIO_CACHE_MAX_MB:-50}
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - tts

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  ollama_data:
  backend_data:
