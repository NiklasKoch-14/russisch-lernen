services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Zieht das Modell einmal beim Hochfahren und beendet sich wieder. Ohne diesen
  # Dienst startet Ollama leer: das Backend faengt den Fehler still auf und
  # liefert statt der Erklaerung die Regel der Einheit — es sieht also aus, als
  # liefe alles. Ein zweiter Lauf kostet nichts, `pull` erkennt vorhandene
  # Modelle. Bewusst hier statt im Makefile, damit auch `docker compose up`
  # ohne make vollstaendig ist.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:1b}"]
    restart: "no"

  # Kein ports-Eintrag: der Dienst ist nur im Docker-Netz erreichbar, das
  # Frontend spricht ausschliesslich das Backend an.
  tts:
    build:
      context: ./tts
      args:
        PIPER_VOICE: ${PIPER_VOICE:-ru_RU-denis-medium}
        PIPER_VOICE_FEMALE: ${PIPER_VOICE_FEMALE:-ru_RU-irina-medium}
    environment:
      - PIPER_VOICE=${PIPER_VOICE:-ru_RU-denis-medium}
      - PIPER_VOICE_FEMALE=${PIPER_VOICE_FEMALE:-ru_RU-irina-medium}
      - PIPER_LENGTH_SCALE=${PIPER_LENGTH_SCALE:-1.15}
      - PIPER_VOLUME=${PIPER_VOLUME:-1.0}

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
      - DB_PATH=/data/speaker.db
      - DEFAULT_LANGUAGE=russian
      - CONTENT_DIR=/app/content/ru
      - GAME_DIR=/app/content/game
      - TTS_HOST=http://tts:5001
      # Muessen mit den Stimmen des tts-Dienstes uebereinstimmen: die Werte gehen
      # in den Zwischenspeicher-Schluessel ein. Zwei Stimmen, weil in den
      # Hoergespraechen zwei Figuren miteinander reden.
      - PIPER_VOICE=${PIPER_VOICE:-ru_RU-denis-medium}
      - PIPER_VOICE_FEMALE=${PIPER_VOICE_FEMALE:-ru_RU-irina-medium}
      - PIPER_LENGTH_SCALE=${PIPER_LENGTH_SCALE:-1.15}
      - AUDIO_CACHE_DIR=/data/audio
      - AUDIO_CACHE_MAX_MB=${AUDIO_CACHE_MAX_MB:-50}
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - tts

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  ollama_data:
  backend_data:
